[package]
name = "solis"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "solis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher compiled in, with its own OpenSSL: no system libraries on Windows or Android
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
